<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#467189"/>
      <stop offset="50%" stop-color="#35586C"/>
      <stop offset="100%" stop-color="#243C4B"/>
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#72A1B8"/>
      <stop offset="100%" stop-color="#5B8A9F"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F1E26" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Background (Squircle for standard icon) -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  
  <!-- Subtle circular grid line representing monitoring dials -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.12" stroke-dasharray="8 6"/>
  
  <!-- Main Lab Equipment Monitor Graphic -->
  <g filter="url(#shadow)">
    <!-- Digital Gauge Ring -->
    <path d="M 160 320 A 130 130 0 1 1 352 320" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-opacity="0.25"/>
    <path d="M 160 320 A 130 130 0 1 1 330 200" fill="none" stroke="#67E8F9" stroke-width="22" stroke-linecap="round"/>
    
    <!-- Central Lab Flask & Thermometer Symbol -->
    <path d="M 238 180 L 238 220 L 195 295 C 185 312 198 335 218 335 L 294 335 C 314 335 327 312 317 295 L 274 220 L 274 180 Z" 
          fill="url(#flaskGrad)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Flask Neck Lip -->
    <rect x="228" y="170" width="56" height="14" rx="7" fill="#FFFFFF"/>
    
    <!-- Pulse ECG / Measurement Wave across the bottom -->
    <path d="M 170 395 L 220 395 L 235 375 L 250 418 L 265 385 L 275 395 L 342 395" 
          fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Target Spec Indicator Dot -->
    <circle cx="256" cy="285" r="14" fill="#34D399"/>
    <circle cx="256" cy="285" r="24" fill="none" stroke="#34D399" stroke-width="4" stroke-opacity="0.6"/>
  </g>
</svg>
